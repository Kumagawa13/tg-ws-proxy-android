name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: armv7-linux-androideabi, aarch64-linux-android, i686-linux-android, x86_64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Build Native Libraries (Rust)
      run: |
        # Указываем точный путь к установленному NDK, который выдала система
        export ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/27.3.13750724"
        export ANDROID_NDK_ROOT="/usr/local/lib/android/sdk/ndk/27.3.13750724"
        cargo ndk -t armeabi-v7a -t arm64-v8a -o app/src/main/jniLibs build --release



    - name: Build APK (Gradle)
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tg-ws-proxy-apk
        path: app/build/outputs/apk/release/*.apk
